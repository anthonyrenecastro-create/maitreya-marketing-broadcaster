apiVersion: apps/v1
kind: Deployment
metadata:
  name: maitreya-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: maitreya-api
  template:
    metadata:
      labels:
        app: maitreya-api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          ports:
            - containerPort: {{ .Values.api.port }}
